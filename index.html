<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>จัดกลุ่มวิชา 2104696 System Improvement</title>
<style>
  :root {
    --bg: #f6f5f2;
    --ink: #1f2421;
    --line: #d8d5cc;
    --panel: #ffffff;
    --accent: #3d5a45;
    --accent-soft: #e7ede8;
    --danger: #b1432f;
    --danger-soft: #f7e6e1;
    --muted: #8a8578;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", "Trebuchet MS", sans-serif;
    padding: 32px 24px 80px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .sub {
    color: var(--muted);
    font-size: 13.5px;
    margin: 0 0 28px;
  }
  .board {
    display: grid;
    grid-template-columns: 260px repeat(5, 1fr);
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 1000px) {
    .board { grid-template-columns: 1fr; }
  }
  .col {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .col-head {
    padding: 10px 12px;
    font-weight: 700;
    font-size: 13.5px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .col.pool .col-head {
    background: #eeece5;
    color: #55503f;
  }
  .count {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .col.over .col-head {
    background: var(--danger-soft);
    color: var(--danger);
  }
  .col.over {
    border-color: var(--danger);
    box-shadow: 0 0 0 1px var(--danger);
  }
  .col.dragover {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent);
  }
  .list {
    flex: 1;
    padding: 8px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 13.5px;
    cursor: grab;
    user-select: none;
    transition: transform .1s ease, box-shadow .1s ease, opacity .15s ease;
  }
  .card:active { cursor: grabbing; }
  .card.dragging {
    opacity: 0.4;
  }
  .col.pool .card {
    background: #fbfaf7;
  }
  .card:hover {
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .placeholder {
    color: var(--muted);
    font-size: 12px;
    padding: 4px 6px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 6px;
    margin: 4px 0;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--danger);
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<h1>จัดกลุ่มวิชา 2104696 System Improvement</h1>
<p class="sub">ลากรายชื่อจากฝั่งซ้ายไปยังกลุ่มที่ต้องการ — แต่ละกลุ่มรับได้สูงสุด <strong>7 คน</strong> ระบบจะไม่ยอมให้ปล่อยเกินจำนวนนี้</p>

<div class="board" id="board"></div>
<div class="toast" id="toast"></div>

<script>
const MAX_PER_GROUP = 7;

const state = [
  {
    header: 'รายชื่อนิสิตในเวลา',
    pool: true,
    items: [
      "Watcharin","Nattaporn","Raviporn","Juthathip","Sirinthorn",
      "Boonyakorn","Rinrada","Haripat","Kantisha","Chanikarn",
      "Nunnaphat","Patcharin","Panmai","Pimlada","Wasithapol",
      "Suphanut","Sittisak","Suthiwat","Akkaravit","Kornphavith",
      "Krittapas","Kavisara","Kantavitch","Kittipong","Kanawit",
      "Thita","Nutsaphon","Danusorn","Donsunti","Tachinee",
      "Thanpimol","Tunwa","Napatchya","Pemika","Pongtorn",
      "Pannara","Phitchayapoom","Pimlaput","Peerada","Vanut","Surachai"
    ]
  },
  { header: 'กลุ่มที่ 1', pool: false, items: [] },
  { header: 'กลุ่มที่ 2', pool: false, items: [] },
  { header: 'กลุ่มที่ 3', pool: false, items: [] },
  { header: 'กลุ่มที่ 4', pool: false, items: [] },
  { header: 'กลุ่มที่ 5', pool: false, items: [] },
];

const board = document.getElementById('board');
const toastEl = document.getElementById('toast');
let dragged = null; // { name, fromIndex }
let toastTimer = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function render() {
  board.innerHTML = '';
  state.forEach((group, gi) => {
    const col = document.createElement('div');
    col.className = 'col' + (group.pool ? ' pool' : '') + (!group.pool && group.items.length > MAX_PER_GROUP ? ' over' : '');
    col.dataset.index = gi;

    const head = document.createElement('div');
    head.className = 'col-head';
    const title = document.createElement('span');
    title.textContent = group.header;
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = group.pool ? group.items.length : `${group.items.length}/${MAX_PER_GROUP}`;
    head.appendChild(title);
    head.appendChild(count);
    col.appendChild(head);

    const list = document.createElement('div');
    list.className = 'list';

    if (group.items.length === 0) {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = 'ลากมาวางที่นี่';
      list.appendChild(ph);
    }

    group.items.forEach((name) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.draggable = true;
      card.textContent = name;
      card.dataset.name = name;

      card.addEventListener('dragstart', (e) => {
        dragged = { name, fromIndex: gi };
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dragged = null;
      });

      list.appendChild(card);
    });

    col.appendChild(list);

    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      col.classList.add('dragover');
    });
    col.addEventListener('dragleave', () => {
      col.classList.remove('dragover');
    });
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('dragover');
      if (!dragged) return;
      const target = state[gi];
      const source = state[dragged.fromIndex];

      if (dragged.fromIndex === gi) return; // dropped back on same column

      if (!target.pool && target.items.length >= MAX_PER_GROUP) {
        showToast(`❌ ${target.header} มีสมาชิกครบ ${MAX_PER_GROUP} คนแล้ว ไม่สามารถเพิ่มได้`);
        return;
      }

      // move item
      source.items = source.items.filter(n => n !== dragged.name);
      target.items.push(dragged.name);
      dragged = null;
      render();
    });
  });
}

render();
</script>
</body>
</html>
